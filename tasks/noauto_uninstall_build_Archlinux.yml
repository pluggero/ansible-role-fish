---
- name: Ensure we are using pacman
  ansible.builtin.fail:
    msg: "This role only supports {{ ansible_os_family }} systems that use pacman as a package manager."
  when: ansible_pkg_mgr != "pacman"

- name: Remove fish build pkgs via pacman
  block:
    - name: Ensure fish build pkgs are removed
      community.general.pacman:
        name: "{{ package }}"
        state: absent
      loop: "{{ fish_build_pkgs_to_remove }}"
      loop_control:
        loop_var: package
      become: true
